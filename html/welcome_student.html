<!DOCTYPE html>
{% load static %}
<html lang="uz" data-bs-theme="dark">

<head>
    <base href="/" />
    <title>{{ site_config.PROJECT_NAME }} – Ro'yxatdan o'tish muvaffaqiyatli</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Styles -->
    <link href="{% static 'plugins/global/plugins.bundle.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'css/style.bundle.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'css/custom.css' %}" rel="stylesheet" type="text/css" />

</head>

<body id="kt_body" class="app-blank">

<div class="d-flex flex-column flex-root">
    <!--begin::Authentication - Success-->
    <div class="d-flex flex-column flex-lg-row flex-column-fluid justify-content-center align-items-center min-vh-100 p-4">

        <!--begin::Wrapper-->
        <div class="w-100 w-sm-75 w-md-500px text-center">

            <!--begin::Logo-->
            <div class="mb-10">
                <img src="{% static 'img/logo1.png' %}" style="max-width: 180px;" alt="Logo">
            </div>
            <!--end::Logo-->

            <!--begin::Card-->
            <div class="card shadow-sm rounded-3">
                <div class="card-body p-8">

                    <!--begin::Heading-->
                    <h1 class="text-gray-900 mb-3 fw-normal">🎉 Ro'yxatdan muvaffaqiyatli o'tdingiz</h1>
                    <p class="text-gray-600 fs-6 mb-6">Sizning profilingiz faol holatda</p>
                    <!--end::Heading-->

                    <!--begin::User Info-->
                    <div class="mb-6 text-start">
                        <p><strong>Ism-Familiya:</strong> {{ request.user.full_name }}</p>
                        <p><strong>Guruh:</strong> {{ student_meta.group.name }}</p>
<!--                        <p><strong>Email:</strong> {{ user_info.email }}</p>-->
                    </div>
                    <!--end::User Info-->

                    <!--begin::Button-->
                    <a href="https://t.me/ubsueduratebot" class="btn btn-primary w-100">
                      <i class="fas fa-telegram"></i>  Botga Qaytish
                    </a>
                    <!--end::Button-->

                </div>
            </div>
            <!--end::Card-->

        </div>
        <!--end::Wrapper-->

    </div>
    <!--end::Authentication - Success-->
</div>

<!-- Scripts -->
<script src="{% static 'plugins/global/plugins.bundle.js' %}"></script>
<script src="{% static 'js/scripts.bundle.js' %}"></script>

</body>
</html>
